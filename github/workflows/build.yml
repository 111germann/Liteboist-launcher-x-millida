name: Build mod
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: mc-1.21.4
            java: 21
            gradle: 8.12.1
          - dir: mc-26.2
            java: 25
            gradle: current
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}
      - run: unzip -q LiteBoost-fabric.zip
      - run: gradle build --no-daemon
        working-directory: LiteBoost/${{ matrix.dir }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: mod-${{ github.run_number }}
          files: LiteBoost/${{ matrix.dir }}/build/libs/liteboost-*.jar
